<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMate — Shopping Assistant</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(255, 193, 7, .20), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(0, 188, 212, .18), transparent 30%),
                #10151d;
            color: #f5f7fa;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .app {
            width: min(100%, 980px);
            height: min(88vh, 760px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 28px;
            background: rgba(20, 26, 35, .88);
            backdrop-filter: blur(18px);
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }

        header {
            padding: 22px 26px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .logo {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffd54f, #ff8f00);
            color: #171717;
            font-size: 24px;
            box-shadow: 0 8px 25px rgba(255, 143, 0, .25);
        }

        h1 { margin: 0; font-size: 20px; }
        .status { margin: 4px 0 0; color: #aeb8c5; font-size: 13px; }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 78%;
            padding: 14px 17px;
            line-height: 1.55;
            white-space: pre-wrap;
            border-radius: 19px;
            animation: appear .18s ease-out;
        }

        .bot {
            align-self: flex-start;
            background: #242c38;
            border-bottom-left-radius: 6px;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            color: #171717;
            border-bottom-right-radius: 6px;
        }

        .composer {
            padding: 18px;
            border-top: 1px solid rgba(255,255,255,.08);
            background: rgba(14, 18, 25, .75);
        }

        form {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 54px;
            max-height: 140px;
            padding: 15px 16px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 17px;
            outline: none;
            background: #1b222d;
            color: #fff;
            font: inherit;
        }

        textarea:focus { border-color: rgba(255, 179, 0, .65); }

        button {
            width: 56px;
            border: 0;
            border-radius: 17px;
            background: #ffb300;
            color: #171717;
            font-size: 20px;
            cursor: pointer;
        }

        button:disabled { opacity: .5; cursor: wait; }

        .hint {
            margin: 9px 4px 0;
            color: #778292;
            font-size: 12px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 650px) {
            body { padding: 0; }
            .app { height: 100vh; border-radius: 0; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="logo">🛍️</div>
            <div>
                <h1>ShopMate</h1>
                <p class="status">AI shopping assistant · Gemini powered</p>
            </div>
        </header>

        <section class="chat" id="chat">
            <div class="message bot">
                Hi! I'm ShopMate 🛍️<br>
                Ask me about products, features, comparisons, budgets, and other shopping-related topics.
            </div>
        </section>

        <div class="composer">
            <form id="chatForm">
                <textarea id="message" placeholder="Ask a shopping question..." rows="1"></textarea>
                <button id="sendButton" type="submit" aria-label="Send">➤</button>
            </form>
            <div class="hint">ShopMate answers shopping-related questions only.</div>
        </div>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;
            message.textContent = text;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 140) + "px";
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            input.style.height = "auto";
            sendButton.disabled = true;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed");
                }

                addMessage(data.reply, "bot");
            } catch (error) {
                addMessage("Sorry, something went wrong. Please try again.", "bot");
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
